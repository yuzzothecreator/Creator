services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: creator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
      POSTGRES_DB: creator
    ports:
      - "5432:5432"
    volumes:
      - creator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: creator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - creator_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: creator-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://creator:creator@postgres:5432/creator?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: creator-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://creator:creator@postgres:5432/creator?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: creator-web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional: FastAPI e-commerce backend (apps/ecommerce-api)
  # Create DB once: docker exec creator-postgres psql -U creator -c "CREATE DATABASE ecommerce;"
  ecommerce-api:
    build:
      context: ..
      dockerfile: apps/ecommerce-api/Dockerfile
    container_name: creator-ecommerce-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://creator:creator@postgres:5432/ecommerce
      DATABASE_URL_SYNC: postgresql://creator:creator@postgres:5432/ecommerce
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  creator_pg:
  creator_redis:
